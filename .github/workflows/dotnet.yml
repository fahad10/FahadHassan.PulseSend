name: .NET CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore FahadHassan.PulseSend.sln
      - run: dotnet build FahadHassan.PulseSend.sln --configuration Release --no-restore
      - run: dotnet test FahadHassan.PulseSend.sln --configuration Release --no-build
